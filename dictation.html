<!DOCTYPE html>

<html dir="rtl" lang="ar">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1, maximum-scale=1" name="viewport"/>
<title>تدريب الإملاء العربي — Sana Neural</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800&amp;family=Noto+Naskh+Arabic:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<style>
  :root{
    --paper:#fbf6e9;--ink:#2f3437;--rule:#cfe0e8;--margin:#e2725b;
    --ok:#2f8f5b;--ok-soft:#dff0e3;--bad:#e2725b;--bad-soft:#ffe4dc;--live:#e0a11b;
    --shadow:0 18px 40px -18px rgba(47,52,55,.45);
    --font-read:"Noto Naskh Arabic",serif;
    --font-ui:"Baloo Bhaijaan 2","Noto Naskh Arabic",sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{font-family:var(--font-ui);
    background:radial-gradient(circle at 15% 10%,#fff7e2 0%,transparent 55%),
               radial-gradient(circle at 85% 90%,#eaf3f6 0%,transparent 55%),#efe7d4;
    color:var(--ink);min-height:100vh;padding:12px 12px 200px;overflow-x:hidden}
  .wrap{max-width:760px;margin:0 auto}
  header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
  h1{font-size:1.05rem;margin:0;font-weight:800}
  h1 span{color:var(--margin)}
  .stats{display:flex;gap:6px}
  .pill{background:#fff;border:2px solid #e6dcc6;border-radius:999px;padding:4px 10px;
    font-size:.8rem;font-weight:700;box-shadow:0 2px 0 #e6dcc6;white-space:nowrap}
  a.back{display:inline-block;font-size:.8rem;color:#5aa9d6;text-decoration:none;margin-bottom:8px;font-weight:700}
  .card{background:var(--paper);border-radius:22px;border:1px solid #e6dcc6;box-shadow:var(--shadow);
    padding:18px;text-align:center}
  .counter{font-size:.85rem;color:#8b9096;font-weight:700}
  .slots{font-family:var(--font-read);font-size:2rem;letter-spacing:.25em;color:#c9bfa6;padding:10px 0 4px;min-height:1.6em}
  input#ans{width:100%;font-family:var(--font-read);font-size:2.1rem;text-align:center;
    border:3px solid #d9cdb2;border-radius:16px;padding:10px;background:#fff;color:var(--ink)}
  input#ans:focus{outline:none;border-color:var(--live)}
  .fb{font-family:var(--font-read);font-size:2rem;min-height:1.6em;padding:8px 0;letter-spacing:.06em}
  .fb i{font-style:normal;padding:0 2px;border-radius:6px}
  .fb i.g{color:var(--ok);background:var(--ok-soft)}
  .fb i.b{color:var(--bad);background:var(--bad-soft);text-decoration:underline wavy}
  .fb i.m{color:#fff;background:var(--bad);border-radius:6px}
  .msg{font-size:.9rem;color:#7b8085;min-height:1.4em;margin-top:4px}
  .msg b{color:var(--live)}
  .bar{height:12px;background:#e6dcc6;border-radius:999px;margin:14px 0 4px;overflow:hidden}
  .bar i{display:block;height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,#f0b429,#2f8f5b);transition:width .3s}
  .controls{position:fixed;bottom:0;right:0;left:0;padding:8px 12px calc(8px + env(safe-area-inset-bottom));
    background:linear-gradient(to top,#efe7d4 74%,rgba(239,231,212,0))}
  .row{display:flex;gap:7px;max-width:760px;margin:0 auto}
  .row+.row{margin-top:7px}
  button{font-family:var(--font-ui);font-weight:700;font-size:.98rem;border:2px solid var(--ink);
    border-radius:14px;background:#fff;color:var(--ink);padding:11px 8px;cursor:pointer;flex:1;
    box-shadow:0 4px 0 var(--ink);transition:transform .1s,box-shadow .1s;touch-action:manipulation}
  button:active{transform:translateY(4px);box-shadow:0 0 0 var(--ink)}
  button.main{background:#2f8f5b;color:#fff;border-color:#1e5c3b;box-shadow:0 4px 0 #1e5c3b;flex:2}
  button.hear{background:#5aa9d6;color:#fff;border-color:#2d6a8f;box-shadow:0 4px 0 #2d6a8f;flex:2}
  button.ghost{background:transparent;border-style:dashed;box-shadow:none;font-size:.8rem;padding:7px}
  button.ghost:active{transform:none}
  dialog{border:none;border-radius:18px;padding:18px;max-width:92vw;width:560px;
    box-shadow:var(--shadow);background:var(--paper);font-family:var(--font-ui)}
  dialog::backdrop{background:rgba(47,52,55,.5)}
  textarea{width:100%;height:150px;font-family:var(--font-read);font-size:1.15rem;
    border:2px solid #d9cdb2;border-radius:12px;padding:10px;background:#fff}
  .win{position:fixed;inset:0;display:none;place-items:center;background:rgba(47,52,55,.78);z-index:9;
    text-align:center;color:#fff;padding:20px}
  .win.show{display:grid}
  .win h2{font-size:1.8rem;margin:.2em 0}
  .wrongs{font-family:var(--font-read);font-size:1.3rem;background:rgba(255,255,255,.12);
    border-radius:12px;padding:10px;margin:10px 0;max-height:32vh;overflow:auto;text-align:right}
  .wrongs div{padding:3px 0;border-bottom:1px dashed rgba(255,255,255,.2)}
  .modes{display:flex;gap:6px;margin:0 0 10px}
  .modes button{flex:1;padding:9px;font-size:.88rem;border-radius:12px;border:2px solid #d9cdb2;
    background:#fff;box-shadow:none;font-weight:700}
  .modes button.act{background:var(--ink);color:#fff;border-color:var(--ink)}
  #tileBox{font-family:var(--font-read);font-size:2.1rem;min-height:3rem;background:#fff;
    border:3px solid #d9cdb2;border-radius:16px;padding:8px;letter-spacing:.04em}
  .tiles{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;margin-top:10px}
  .tiles button{flex:0 0 auto;min-width:44px;padding:9px 6px;font-family:var(--font-read);
    font-size:1.35rem;border-radius:10px;box-shadow:0 3px 0 var(--ink)}
  .tiles button.sp{min-width:74px;font-size:.85rem;font-family:var(--font-ui)}
  #pad{width:100%;height:230px;background:#fff;border:3px solid #d9cdb2;border-radius:16px;
    touch-action:none;display:block}
  .padwrap{position:relative}
  .reveal{font-family:var(--font-read);font-size:2.2rem;color:var(--ok);min-height:1.4em;margin-top:6px}
  .selfrow{display:flex;gap:7px;margin-top:8px}
  .selfrow button{flex:1}
  .hide{display:none}
  .confetti{position:fixed;top:-20px;width:10px;height:16px;z-index:10;pointer-events:none;border-radius:2px}


/* Sana device-aware dictation layout */
body{
  --dict-side:0px;
  transition:padding .18s ease;
}
body[data-sana-device="desktop"] .wrap{
  max-width:820px;
}
body[data-sana-device="desktop"] .card{
  max-width:760px;
  margin-inline:auto;
}
body[data-sana-device="tablet"] .wrap{
  max-width:700px;
}
body[data-sana-device="tablet"][data-sana-layout="landscape"]{
  padding-left:20px;
  padding-right:20px;
}
body[data-sana-device="tablet"][data-sana-layout="landscape"] .card{
  max-width:720px;
}
body[data-sana-device="tablet"][data-sana-layout="portrait"] .card{
  max-width:650px;
}
body[data-sana-device="tablet"] input#ans{
  font-size:2rem;
}
body[data-sana-device="tablet"] #pad{
  height:250px;
}
body[data-sana-device="phone"]{
  padding-left:10px;
  padding-right:10px;
  padding-bottom:230px;
}
body[data-sana-device="phone"] .wrap{
  max-width:100%;
}
body[data-sana-device="phone"] header{
  align-items:flex-start;
}
body[data-sana-device="phone"] .stats{
  flex-wrap:wrap;
  justify-content:flex-end;
}
body[data-sana-device="phone"] .modes{
  position:sticky;
  top:6px;
  z-index:5;
  padding:5px;
  margin-inline:-2px;
  background:rgba(239,231,212,.94);
  backdrop-filter:blur(6px);
  border-radius:14px;
}
body[data-sana-device="phone"] .modes button{
  font-size:.8rem;
  padding:8px 5px;
}
body[data-sana-device="phone"] .card{
  padding:14px 12px;
  border-radius:20px;
}
body[data-sana-device="phone"] .slots{
  font-size:1.7rem;
}
body[data-sana-device="phone"] input#ans{
  font-size:1.8rem;
  padding:9px 8px;
}
body[data-sana-device="phone"] .fb{
  font-size:1.7rem;
}
body[data-sana-device="phone"] #pad{
  height:210px;
}
body[data-sana-device="phone"] .controls{
  padding-left:9px;
  padding-right:9px;
}
body[data-sana-device="phone"] .controls .row{
  gap:6px;
}
body[data-sana-device="phone"] .controls button{
  font-size:.88rem;
  padding:10px 6px;
}
body[data-sana-device="phone"] dialog{
  width:calc(100vw - 24px);
  max-width:calc(100vw - 24px);
  padding:15px;
}
@media(max-width:380px){
  body[data-sana-device="phone"] .controls{
    padding-bottom:calc(6px + env(safe-area-inset-bottom));
  }
  body[data-sana-device="phone"] .controls button{
    font-size:.82rem;
  }
}

<body>
<div class="wrap">
<header>
<h1>تدريب <span>الإملاء</span> ✍️</h1>
<div class="stats">
<div class="pill">⭐ <span id="score">0</span></div>
<div class="pill">📊 <span id="prog">0</span>%</div>
</div>
</header>
<div class="modes">
<button class="act" id="mKb" aria-pressed="true">⌨️ لوحة</button>

<div class="card">

<div class="hide" id="tileWrap">
<div id="tileBox"></div>

</div>
<div class="hide" id="drawWrap">
<div class="padwrap"><canvas id="pad"></canvas></div>
<div class="selfrow">
<button class="ghost" id="pUndo">↩ تراجع</button>
<button class="ghost" id="pClear">🗑 مسح</button>
<button class="hear" id="pShow">👁 أظهري الكلمة</button>
</div>
<div class="reveal" id="reveal"></div>
<div class="selfrow hide" id="selfMark">
<button id="pRight" style="background:#2f8f5b;color:#fff;border-color:#1e5c3b;box-shadow:0 4px 0 #1e5c3b">✓ كتبتها صح</button>

</div>
</div>

</div>

</div>

</div>
<div class="row">
<button id="slowBtn">🐢 ببطء</button>
<button id="hintBtn">💡 تلميح</button>
<button id="skipBtn">⏭ تخطّي</button>
</div>
<div class="row">
<button class="ghost" id="editBtn">✎ غيّري النص</button>

</div>
</div>

<div>
<div id="wIcon" style="font-size:3.4rem">🏆</div>

<div class="row" style="max-width:420px;margin:auto">
<button id="againWrong" style="background:#fff">🔁 درّبي على الأخطاء</button>
<button class="ghost" id="againAll" style="color:#fff;border-color:#fff">↺ النص كامل</button>
</div>
</div>
</div>
<dialog id="dlg" aria-labelledby="dictationDialogTitle">
<h3 id="dictationDialogTitle" style="margin-top:0">غيّري النص</h3>
<label for="ta" class="sr-only">النص المخصص للإملاء</label>
<textarea id="ta"></textarea>
<div class="row" style="margin-top:10px">
<button id="applyTextBtn">حفظ وابدأ</button>
<button class="ghost" id="closeDictDlgBtn">إلغاء</button>
</div>
</dialog>
<script>
const DEFAULT_TEXT = "تدوينُ رؤوسِ الأقلامِ إحدى التقنياتِ التي دعتِ الحاجةُ إليها، نظرًا لكثرةِ وسائلِ الاتصالِ، فلمَ لا تبادرُ إلى استخدامِ هذه التقنية في دراسِتك؟";
const $ = id => document.getElementById(id);

let words = [], idx = 0, score = 0, tries = 0, wrongs = [], sentenceMode = false, rate = 0.9;
let mode = 'kb', tileStr = '';
const LETTERS = ['ا','ب','ت','ث','ج','ح','خ','د','ذ','ر','ز','س','ش','ص','ض','ط','ظ','ع','غ','ف','ق','ك','ل','م','ن','ه','و','ي','أ','إ','آ','ء','ؤ','ئ','ة','ى','ال'];

/* مفتاح التسجيلات: نفس تطبيع صفحة القراءة */
const keyNorm = window.sanaUtils.normalizeArabicKey;
/* تدقيق الإملاء: نشيل التشكيل والترقيم فقط — الهمزات والتاء المربوطة تفرق */
function spellNorm(s){
  return (s||"").replace(/[\u064B-\u0652\u0670\u0640]/g,"")
    .replace(/[^\u0621-\u064A0-9]/g,"").trim();
}

/* ===== الصوت: تسجيلاتك أولاً، بعدها صوت الجهاز ===== */
const recAudio = new Audio();
const recGet = w => window.sanaRecordings.get(w, keyNorm);
let azureAudio=null; let azureSynth=null;

async function ensureAzureSynth(rate){
  const SDK=await window.sanaSpeech.loadSdk();
  const tokenData=await window.sanaSpeech.getToken(false);
  const token=tokenData.token;
  const cfg=SDK.SpeechConfig.fromAuthorizationToken(token, tokenData.region || window.DICTATION_APP_CONFIG.REGION);
  cfg.speechSynthesisVoiceName=tokenData.voice || window.DICTATION_APP_CONFIG.VOICE;
  cfg.speechSynthesisLanguage='ar-JO';
  const rr=Math.max(0.5,Math.min(1.3,Number(rate)||0.75));
  const audio=SDK.AudioConfig.fromDefaultSpeakerOutput();
  const synth=new SDK.SpeechSynthesizer(cfg,audio);
  return {SDK,synth,rate:rr};
}
async function say(t,r){
  const text=String(t||'').trim(); if(!text) return;
  const b=await recGet(t);
  if(b){ try{ const u=URL.createObjectURL(b); recAudio.src=u; recAudio.playbackRate=1; recAudio.onended=()=>URL.revokeObjectURL(u); await recAudio.play(); return; }catch(e){} }
  try{
    if(azureSynth){ try{azureSynth.close();}catch(e){} azureSynth=null; }
    const got=await ensureAzureSynth(r); azureSynth=got.synth;
    const ssml=`<speak version="1.0" xml:lang="ar-JO"><voice name="${window.DICTATION_APP_CONFIG.VOICE}"><prosody rate="${Math.round((got.rate-1)*100)}%">${text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\"/g,'&quot;')}</prosody></voice></speak>`;
    await new Promise((resolve,reject)=>{
      got.synth.speakSsmlAsync(ssml,()=>{try{got.synth.close();}catch(e){} azureSynth=null; resolve();},err=>{try{got.synth.close();}catch(e){} azureSynth=null; reject(new Error(String(err||'Azure synthesis failed')));});
    });
  }catch(e){
    msg('⚠️ لم يعمل صوت Sana: '+window.sanaUtils.escapeHtml(window.sanaSpeech.errorMessage(e)));
    console.error(e);
  }
}


/* ===== العرض ===== */
function msg(h){ $('msg').innerHTML = h; }
function target(){ return sentenceMode ? words.join(' ') : words[idx]; }
function build(txt){
  words = txt.trim().split(/\s+/).filter(Boolean);
  idx=0; score=0; tries=0; wrongs=[]; paint();
}
function paint(){
  const t = target() || '';
  $('cnow').textContent = Math.min(idx+1, words.length);
  $('ctot').textContent = words.length;
  $('slots').textContent = sentenceMode ? '' : '_ '.repeat(spellNorm(t).length).trim();
  $('ans').value=''; $('fb').innerHTML='';
  tileStr=''; if($('tiles').dataset.done) renderTiles();
  if(mode==='draw') resetPad();
  const pct = words.length ? Math.round(idx/words.length*100) : 0;
  $('fill').style.width = pct+'%'; $('prog').textContent = pct; $('score').textContent = score;
  tries = 0;
  if(mode==='kb') $('ans').focus();
}

/* ===== مقارنة الحروف ===== */
function diff(a, b){   // a = المكتوب، b = الصحيح
  const m=a.length, n=b.length;
  const d=Array.from({length:m+1},(_,i)=>[i,...Array(n).fill(0)]);
  for(let j=0;j<=n;j++) d[0][j]=j;
  for(let i=1;i<=m;i++) for(let j=1;j<=n;j++)
    d[i][j] = Math.min(d[i-1][j]+1, d[i][j-1]+1, d[i-1][j-1] + (a[i-1]===b[j-1]?0:1));
  let i=m, j=n, out=[];
  while(i>0 || j>0){
    if(i>0 && j>0 && a[i-1]===b[j-1] && d[i][j]===d[i-1][j-1]){ out.unshift({c:b[j-1],k:'g'}); i--; j--; }
    else if(i>0 && j>0 && d[i][j]===d[i-1][j-1]+1){ out.unshift({c:b[j-1],k:'b'}); i--; j--; }
    else if(j>0 && d[i][j]===d[i][j-1]+1){ out.unshift({c:b[j-1],k:'m'}); j--; }
    else { i--; }   // حرف زائد بالمكتوب
  }
  return out;
}
function showDiff(a, b){
  $('fb').innerHTML = diff(a,b).map(x=>'<i class="'+x.k+'">'+window.sanaUtils.escapeHtml(x.c)+'</i>').join('');
}

/* ===== التحقّق ===== */
function check(){
  const raw = mode==='tile' ? tileStr : $('ans').value;
  const typed = spellNorm(raw);
  const right = spellNorm(target());
  if(!typed){ msg('اكتبي الكلمة أول 🙂'); return; }
  if(typed === right){
    window.sanaUtils.beep(880,.12); setTimeout(()=>window.sanaUtils.beep(1320,.14),90);
    score++;
    $('fb').innerHTML = '<i class="g">'+window.sanaUtils.escapeHtml(target())+'</i>';
    msg('✅ صح! أحسنتِ');
    if(sentenceMode || idx >= words.length-1){ idx = words.length; setTimeout(finish, 700); return; }
    idx++;
    setTimeout(()=>{ paint(); say(target(), rate); }, 800);
    return;
  }
  tries++;
  window.sanaUtils.beep(220,.18);
  showDiff(typed, right);
  if(tries >= 3){
    if(!wrongs.includes(target())) wrongs.push(target());
    msg('الكلمة الصحيحة: <b>'+window.sanaUtils.escapeHtml(target())+'</b> — الحروف الملوّنة هي الغلط.');
    if(sentenceMode || idx >= words.length-1){ idx = words.length; setTimeout(finish, 1800); return; }
    idx++;
    setTimeout(()=>{ paint(); say(target(), rate); }, 2200);
  } else {
    msg('مش مضبوط، جرّبي كمان مرة ('+tries+'/3) — الأحمر غلط والمخطوط ناقص.');
    $('ans').select();
  }
}
function finish(){
  paint();
  const total = sentenceMode ? 1 : words.length;
  $('wIcon').textContent = wrongs.length ? '💪' : '🏆';
  $('wTitle').textContent = wrongs.length ? 'خلّصتِ! في كلمات بتحتاج تمرين' : 'ممتازة! كل الكلمات صح';
  $('wMsg').textContent = 'صح '+score+' من '+total;
  $('wList').innerHTML = wrongs.length
    ? '<div style="font-weight:700;border:none">كلمات للتمرين:</div>' + wrongs.map(w=>'<div>• '+window.sanaUtils.escapeHtml(w)+'</div>').join('')
    : '';
  $('againWrong').style.display = wrongs.length ? '' : 'none';
  $('win').classList.add('show');
  if(!wrongs.length){ [523,659,784,1047].forEach((f,i)=>setTimeout(()=>window.sanaUtils.beep(f,.25),i*140));
    window.sanaEffects.confetti(50); }
}

/* ===== أوضاع الإدخال ===== */
function setMode(m){
  mode = m;
  $('mKb').classList.toggle('act', m==='kb');
  $('mTile').classList.toggle('act', m==='tile');
  $('mDraw').classList.toggle('act', m==='draw');
  $('mKb').setAttribute('aria-pressed', String(m==='kb'));
  $('mTile').setAttribute('aria-pressed', String(m==='tile'));
  $('mDraw').setAttribute('aria-pressed', String(m==='draw'));
  $('ans').classList.toggle('hide', m!=='kb');
  $('tileWrap').classList.toggle('hide', m!=='tile');
  $('drawWrap').classList.toggle('hide', m!=='draw');
  $('okBtn').classList.toggle('hide', m==='draw');
  if(m==='tile'){ tileStr=''; renderTiles(); }
  if(m==='draw'){ setupPad(); resetPad(); }
  if(m==='kb') $('ans').focus();
  $('fb').innerHTML='';
  msg(m==='draw' ? 'اسمعي الكلمة واكتبيها بإصبعك، بعدين اضغطي 👁 لتشوفي الصح.'
    : (m==='tile' ? 'اسمعي الكلمة وركّبيها من الحروف 🔤' : 'اسمعي الكلمة واكتبيها ⌨️'));
}
function renderTiles(){
  $('tileBox').textContent = tileStr || ' ';
  const box = $('tiles');
  if(box.dataset.done) return;
  box.dataset.done = '1';
  LETTERS.forEach(L=>{
    const b=document.createElement('button');
    b.textContent = L;
    b.onclick = ()=>{ tileStr += L; renderTiles(); };
    box.appendChild(b);
  });
  const sp=document.createElement('button');
  sp.className='sp'; sp.textContent='مسافة';
  sp.onclick=()=>{ tileStr += ' '; renderTiles(); };
  box.appendChild(sp);
  const bs=document.createElement('button');
  bs.className='sp'; bs.textContent='⌫ حرف';
  bs.onclick=()=>{ tileStr = tileStr.slice(0,-1); renderTiles(); };
  box.appendChild(bs);
  const cl=document.createElement('button');
  cl.className='sp'; cl.textContent='🗑 مسح';
  cl.onclick=()=>{ tileStr=''; renderTiles(); };
  box.appendChild(cl);
}

/* ===== لوح الكتابة بالإصبع ===== */
let pad, pctx, drawing=false, strokes=[], cur=null, padReady=false;
function setupPad(){
  pad = $('pad');
  if(!padReady){
    padReady = true;
    pad.addEventListener('pointerdown', e=>{ e.preventDefault(); drawing=true;
      cur=[[e.offsetX,e.offsetY]]; strokes.push(cur); });
    pad.addEventListener('pointermove', e=>{ if(!drawing) return; e.preventDefault();
      cur.push([e.offsetX,e.offsetY]); drawPad(); });
    ['pointerup','pointercancel','pointerleave'].forEach(ev=>
      pad.addEventListener(ev, ()=>{ drawing=false; }));
    window.addEventListener('resize', ()=>{ sizePad(); drawPad(); });
  }
  sizePad(); drawPad();
}
function sizePad(){
  const r = pad.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  pad.width = r.width*dpr; pad.height = r.height*dpr;
  pctx = pad.getContext('2d');
  pctx.scale(dpr,dpr);
  pctx.lineWidth = 5; pctx.lineJoin='round'; pctx.lineCap='round'; pctx.strokeStyle='#2f3437';
}
function drawPad(){
  const r = pad.getBoundingClientRect();
  pctx.clearRect(0,0,r.width,r.height);
  pctx.save();
  pctx.strokeStyle='#cfe0e8'; pctx.lineWidth=2;
  pctx.beginPath(); pctx.moveTo(10, r.height*0.68); pctx.lineTo(r.width-10, r.height*0.68); pctx.stroke();
  pctx.restore();
  pctx.strokeStyle='#2f3437'; pctx.lineWidth=5;
  strokes.forEach(st=>{
    pctx.beginPath();
    st.forEach((p,i)=> i? pctx.lineTo(p[0],p[1]) : pctx.moveTo(p[0],p[1]));
    pctx.stroke();
  });
}
function resetPad(){ strokes=[]; if(pctx) drawPad(); $('reveal').textContent=''; $('selfMark').classList.add('hide'); }
function nextAfterMark(){
  if(sentenceMode || idx >= words.length-1){ idx = words.length; finish(); return; }
  idx++; paint(); resetPad(); say(target(), rate);
}

/* ===== الأزرار ===== */
$('applyTextBtn')?.addEventListener('click',applyText);
$('closeDictDlgBtn')?.addEventListener('click',()=>$('dlg').close());
$('mKb').onclick = ()=> setMode('kb');
$('mTile').onclick = ()=> setMode('tile');
$('mDraw').onclick = ()=> setMode('draw');
$('pUndo').onclick = ()=>{ strokes.pop(); drawPad(); };
$('pClear').onclick = ()=>{ strokes=[]; drawPad(); };
$('pShow').onclick = ()=>{
  $('reveal').textContent = target();
  $('selfMark').classList.remove('hide');
  msg('قارني كتابتك مع الكلمة، واضغطي صح أو غلط.');
};
$('pRight').onclick = ()=>{ score++; window.sanaUtils.beep(880,.12); setTimeout(()=>window.sanaUtils.beep(1320,.14),90); nextAfterMark(); };
$('pWrong').onclick = ()=>{ if(!wrongs.includes(target())) wrongs.push(target()); window.sanaUtils.beep(220,.18); nextAfterMark(); };
$('hearBtn').onclick = ()=> say(target(), rate);
$('slowBtn').onclick = ()=> say(target(), .5);
$('okBtn').onclick = check;
$('ans').addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); check(); } });
$('hintBtn').onclick = ()=>{
  const t = spellNorm(target());
  const shown = Math.min(t.length, 1 + Math.floor(tries));
  $('slots').textContent = t.slice(0, shown).split('').join(' ') + ' ' + '_ '.repeat(Math.max(0,t.length-shown)).trim();
  msg('التلميح: الكلمة فيها <b>'+t.length+'</b> حروف.');
};
$('skipBtn').onclick = ()=>{
  if(!wrongs.includes(target())) wrongs.push(target());
  if(sentenceMode || idx >= words.length-1){ idx = words.length; finish(); return; }
  idx++; paint(); say(target(), rate);
};
$('resetBtn').onclick = ()=>{ $('win').classList.remove('show'); idx=0; score=0; wrongs=[]; sentenceMode=false;
  $('sentBtn').textContent='📝 وضع الجملة'; paint(); };
$('editBtn').onclick = ()=>{ $('ta').value = words.join(' '); $('dlg').showModal(); };
$('sentBtn').onclick = ()=>{
  sentenceMode = !sentenceMode;
  $('sentBtn').textContent = sentenceMode ? '🔠 وضع الكلمة' : '📝 وضع الجملة';
  idx=0; score=0; wrongs=[]; paint();
  msg(sentenceMode ? 'اسمعي الجملة كاملة واكتبيها 📝' : 'كلمة كلمة 🔠');
};
$('againWrong').onclick = ()=>{
  if(!wrongs.length) return;
  build(wrongs.join(' '));
  $('win').classList.remove('show');
  say(target(), rate);
};
$('againAll').onclick = ()=>{ $('win').classList.remove('show'); build(words.join(' ')); };
function applyText(){ const v=$('ta').value.trim(); if(v) build(v); $('dlg').close(); }
if(window.speechSynthesis) speechSynthesis.onvoiceschanged = ()=>{};

// القراءة هي المصدر الرئيسي للنص. عند فتح الإملاء نستخدم آخر نص محفوظ،
// وأي تغيير جديد من صفحة القراءة يصل هنا تلقائيًا عبر storage event.
const initialSharedText = window.sanaTextSync?.get?.();
build(initialSharedText?.text || DEFAULT_TEXT);
if(window.sanaTextSync?.onChange){
  window.sanaTextSync.onChange(shared => {
    const incoming = String(shared?.text || '').trim();
    if(!incoming) return;
    build(incoming);
    msg('🔄 تم تحديث النص تلقائيًا من تدريب القراءة.');
    setTimeout(()=>say(target(), rate), 120);
  });
}
</script>
