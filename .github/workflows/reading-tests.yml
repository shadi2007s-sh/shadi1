name: Reading app regression tests
on:
  push:
    branches:
      - repair/reading-dictation-audit-2026-11
  workflow_dispatch:
jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/sana-text.test.mjs
